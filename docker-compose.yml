version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ariya_app
    container_name: ariya_app
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: ariya
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./:/var/www/html
    networks:
      - ariya

  web:
    image: nginx:alpine
    container_name: ariya_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ariya

  db:
    image: mysql:8.0
    container_name: ariya_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ariya
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ariya

volumes:
  db_data:

networks:
  ariya:
